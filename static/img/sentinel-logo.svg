<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="40" height="40" fill="none">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="sx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shield Metallic Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cyan Laser Accent Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Core Cross Gradient -->
    <linearGradient id="core-x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <path d="M24 3 L43 9 V23 C43 33.5 34.5 41.8 24 45 C13.5 41.8 5 33.5 5 23 V9 L24 3 Z" 
        fill="url(#shield-grad)" 
        stroke="url(#cyan-glow)" 
        stroke-width="1.8" 
        stroke-linejoin="round"
        filter="url(#sx-glow)" />

  <!-- Inner Subtle Shield Contour -->
  <path d="M24 6.5 L39.5 11.5 V23 C39.5 31.5 32.8 38.5 24 41.5 C15.2 38.5 8.5 31.5 8.5 23 V11.5 L24 6.5 Z" 
        fill="#090D16" 
        fill-opacity="0.6"
        stroke="#1E3A8A" 
        stroke-width="1" />

  <!-- Radar Grid Target Rings -->
  <circle cx="24" cy="24" r="10" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" fill="none" />
  <circle cx="24" cy="24" r="5" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" fill="none" />

  <!-- Stylized Angular SENTINEL "X" with Diamond Core -->
  <!-- Top-Left to Bottom-Right Blade -->
  <path d="M15 15 L21 21 L16 33 H20.5 L24 25 L27.5 33 H32 L27 21 L33 15 H28.5 L24 21.5 L19.5 15 H15 Z" 
        fill="url(#core-x-grad)" />

  <!-- Glowing Sentinel Sensor Core (Diamond) -->
  <polygon points="24,19 28,23 24,27 20,23" fill="#38BDF8" />
  <circle cx="24" cy="23" r="1.8" fill="#FFFFFF" />

  <!-- Tactical Radar Tick Marks -->
  <line x1="24" y1="8" x2="24" y2="11" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="36" x2="24" y2="39" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="10" y1="23" x2="13" y2="23" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="35" y1="23" x2="38" y2="23" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
</svg>
